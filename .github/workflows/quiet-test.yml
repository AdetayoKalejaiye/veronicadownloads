name: Test the quiet step wrapper
on: workflow_dispatch
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      SHOW_LOGS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          path: downloads
      - name: Use Git Bash for bash steps
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = (Get-Command git -ErrorAction SilentlyContinue).Source
          $bin = Join-Path (Split-Path (Split-Path $git)) 'bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin -Encoding ascii
      - name: Make the app folder the build steps run in
        shell: bash
        run: mkdir app
      - name: Quiet bash step that succeeds
        working-directory: app
        shell: bash --noprofile --norc ../downloads/scripts/release/quiet.sh {0}
        run: |
          echo "THIS-SHOULD-BE-HIDDEN ${{ matrix.runner }}"
          echo "::warning::kept warning"
          pwd
      - name: Quiet bash step that fails
        working-directory: app
        id: fails
        continue-on-error: true
        shell: bash --noprofile --norc ../downloads/scripts/release/quiet.sh {0}
        run: |
          echo "HIDDEN-FAILURE-OUTPUT"
          false
          echo "should not run"
      - name: The failing step really failed
        shell: bash
        run: test "${{ steps.fails.outcome }}" = failure
      - name: Quiet PowerShell step
        if: runner.os == 'Windows'
        working-directory: app
        shell: bash --noprofile --norc ../downloads/scripts/release/quiet.sh {0} powershell
        run: |
          Write-Host "HIDDEN-POWERSHELL ${{ matrix.runner }}"
          Write-Host "::warning::kept powershell warning"
          $code = 0
          exit $code
      - name: Quiet PowerShell step that throws
        id: throws
        if: runner.os == 'Windows'
        working-directory: app
        continue-on-error: true
        shell: bash --noprofile --norc ../downloads/scripts/release/quiet.sh {0} powershell
        run: |
          throw "HIDDEN-THROW"
      - name: The throwing step really failed
        if: runner.os == 'Windows'
        shell: bash
        run: test "${{ steps.throws.outcome }}" = failure
